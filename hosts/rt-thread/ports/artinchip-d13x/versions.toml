# PocketJS ArtInChip D13x port - pinned baseline.
#
# Recorded by actually running the commands, not copied from documentation.
# Once Gate 0 starts, these SHAs do not move without a dedicated upgrade task
# that re-runs the ABI, core, renderer and QuickJS gates.

[pocketjs]
# Baseline this port branched from. `main` at the time the d13x branch was cut.
commit = "d7deb80e5ddbebf50180ab90f309455758a65c21"
branch = "d13x"
remote = "https://github.com/boa-z/pocketjs.git"

[luban_lite]
# The SDK this port builds against.
#
# History, recorded rather than hidden: the port first pinned
# github.com/artinchip/luban-lite. That was abandoned on 2026-09-24 by explicit
# user direction, because that mirror cannot support the target board:
#   * It is frozen at v1.0.3 (pushed 2024-02-23), has exactly one branch
#     (`main`) and zero tags, while this product SDK is based on V1.3.2.
#   * That snapshot has no D133ECS support at all - no `ram_param.c` (the PSRAM
#     fuse/variant table that makes `aic_get_ram_size()` correct), no
#     `CPU_PSRAM_BASE`/`CPU_SRAM_BASE`, and no `target/d13x/d50t-2-lite/`.
#   * Re-deriving the board on top of v1.0.3 would have meant back-porting the
#     chip Kconfig, the memory map and the PSRAM bring-up, i.e. exactly the
#     "unrecorded SDK upgrade" the spec forbids.
local_path = "C:/Users/JCSH/Documents/Project/D50T-2-Lite/luban-lite-jc-d50t-rev"
remote = "https://github.com/boa-w/luban-lite-jc-d50t-rev.git"
release = "Luban-Lite V1.3.2"

# Product branch the port branch was cut from.
base_branch = "codex/d50t-meter-adaptation"
base_commit = "f7572509111d1c70962e6347e5ad7bc87b77fbba"

# The independent PocketJS port branch. All D13x port work lands here so the
# product line stays untouched; this branch is never merged back automatically.
port_branch = "pocketjs-d13x"

[rust]
# Pinned deliberately. Matches engine/ui-cabi/rust-toolchain.toml so Gate 1
# builds the retained UI core with the compiler Gate 0 validated.
toolchain = "nightly-2026-07-02"
rustc = "1.98.0-nightly (4c9d2bfe4 2026-07-01)"
components = ["rust-src"]
build_std = ["core", "alloc", "compiler_builtins"]
# Required by this rustc: JSON target specs need an explicit opt-in.
extra_flags = ["-Zjson-target-spec"]

[target]
# The name comes from the JSON filename: rust/targets/d13x-e907-ilp32d.json
name = "d13x-e907-ilp32d"
arch = "riscv32"
abi = "ilp32d"
cpu = "e907fdp"
isa = "rv32imafdc"
# Deliberately excludes the firmware's P extension, XThead and vendor
# instructions (spec 10.1). Rust emits the standard RV32IMAFDC subset, which
# is what the SDK itself uses for M_DEVICE.
pointer_width = 32
panic = "abort"
freestanding = true

[firmware_toolchain]
# Vendored by the product SDK at <sdk>/toolchain (git-ignored upstream, so it
# is present in a working checkout but absent from a bare clone).
vendor = "Xuantie"
release = "Xuantie-900 elf newlib gcc Toolchain V2.6.1 B-20220906"
gcc = "10.2.0"
binutils = "2.35"
prefix = "riscv64-unknown-elf-"
# binutils 2.35 cannot parse the extension names LLVM 20 writes into
# Tag_RISCV_arch (zmmul/zaamo/zalrsc/zca/zcd/zcf), so the link dies with
# "failed to merge target specific data" once per libc member. The Rust archive
# is therefore passed through tools/patch-riscv-attrs.py, which drops
# .riscv.attributes and leaves e_flags (the ABI) untouched. See README.md.
attribute_normalisation = "patch-riscv-attrs.py"

[firmware_flags]
# Read from bsp/artinchip/sys/d13x/rtconfig.py in the pinned SDK, CPUNAME=e907fdp.
march = "rv32imafdcpzpsfoperand_xtheade"
mabi = "ilp32d"
# rtconfig.py line 103 sets -mcmodel=medany. Rust's target JSON leaves the
# code model at LLVM's default (`small`/medlow). Both reach every D13x region
# (SRAM 0x3004_0000, PSRAM 0x4000_0000) from absolute zero, so they are
# interchangeable here; recorded so the mismatch is a known, measured fact
# rather than a surprise.
mcmodel = "medany"
mcmodel_rust = "small"
# The SDK's own module build uses exactly this subset, which is the precedent
# for the Rust target's ISA choice.
m_device_march = "rv32imafdc"
m_device_mabi = "ilp32d"
# Link line for the RT-Thread kernel (rtconfig.py), reproduced so the Rust
# staticlib is appended to the same flags the C objects use.
link_flags = "-nostartfiles -Wl,--no-whole-archive -lgcc -Wl,-gc-sections -Wl,-zmax-page-size=1024"

[board]
name = "d50t-2-lite"
soc = "D133ECS"
psram_size = "0x1000000"
sram_size = "0x100000"
app = "pocketjs-smoke"
defconfig = "d13x_d50t-2-lite_rt-thread_pocketjs-smoke_defconfig"
